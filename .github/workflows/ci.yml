name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Secret scan
        run: node scripts/secret-scan.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and property tests
        run: npx vitest run
      - name: Web build
        run: npm run build
